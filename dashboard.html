<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crypto Pump Scanner</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:#edf2ff;font-family:Arial,sans-serif}
header{padding:22px 16px;background:#111a2d;border-bottom:1px solid #26334c}
h1{font-size:25px;margin:0 0 8px}
.sub{color:#9baac4;font-size:13px}
main{max-width:1100px;margin:auto;padding:16px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.stat{background:#111a2d;border:1px solid #26334c;border-radius:12px;padding:14px 10px}
.stat strong{display:block;font-size:23px;margin-bottom:5px;overflow-wrap:anywhere}
.stat span{font-size:12px;color:#9baac4}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
button{background:#17233a;border:1px solid #34435e;color:#eaf0ff;padding:10px 13px;border-radius:9px;font-weight:bold}
button.active{background:#245eea;border-color:#245eea}
#status{font-size:13px;color:#9baac4;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:#111a2d;border:1px solid #26334c;border-radius:13px;padding:15px;min-width:0}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.token{font-size:19px;font-weight:bold;overflow-wrap:anywhere}
.chain{font-size:11px;background:#263653;padding:5px 8px;border-radius:20px;white-space:nowrap}
.change{font-size:21px;font-weight:bold;color:#48e0a0;margin:12px 0}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.metric span{display:block;color:#91a1bd;font-size:11px;margin-bottom:4px}
.metric strong{font-size:14px;overflow-wrap:anywhere}
.address{font-size:11px;color:#91a1bd;overflow-wrap:anywhere;margin-top:12px}
a{color:#83b5ff;text-decoration:none}
.link{display:block;margin-top:13px;background:#1b2d4c;text-align:center;padding:11px;border-radius:8px;font-weight:bold}
.empty{grid-column:1/-1;text-align:center;padding:30px;color:#9baac4;background:#111a2d;border-radius:12px}
footer{color:#7889a5;font-size:12px;text-align:center;padding:25px}
@media(max-width:600px){
 header{padding:18px 13px}
 h1{font-size:22px}
 main{padding:12px}
 .grid{grid-template-columns:1fr}
 .stats{gap:7px}
 .stat{padding:12px 8px}
 .stat strong{font-size:20px}
 button{flex:1;padding:10px 6px;font-size:12px}
}
</style>
</head>
<body>
<header>
  <h1>🚀 Crypto Pump Scanner</h1>
  <div class="sub">Ethereum · Solana · Robinhood Chain</div>
</header>
<main>
  <section class="stats">
    <div class="stat"><strong id="total">0</strong><span>Matching signals</span></div>
    <div class="stat"><strong id="eth">0</strong><span>Ethereum</span></div>
    <div class="stat"><strong id="robinhood">0</strong><span>Robinhood Chain</span></div>
  </section>
  <div class="filters">
    <button class="active" data-filter="all">All networks</button>
    <button data-filter="ethereum">Ethereum</button>
    <button data-filter="solana">Solana</button>
    <button data-filter="robinhood">Robinhood</button>
  </div>
  <div id="status">Loading signals…</div>
  <section class="grid" id="cards"></section>
</main>
<footer>
  Data from DexScreener · Refreshes every 5 minutes<br>
  Momentum signals are not financial advice. Tokens can lose all their value.
</footer>
<script>
let signals = [];
let activeFilter = "all";
const el = id => document.getElementById(id);
function money(value) {
  const n = Number(value);
  if (!Number.isFinite(n)) return "—";
  if (n >= 1e9) return "$" + (n / 1e9).toFixed(2) + "B";
  if (n >= 1e6) return "$" + (n / 1e6).toFixed(2) + "M";
  if (n >= 1e3) return "$" + (n / 1e3).toFixed(1) + "K";
  return "$" + n.toFixed(2);
}
function safeText(value) {
  return String(value ?? "—").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}
function render() {
  el("total").textContent = signals.length;
  el("eth").textContent =
    signals.filter(s => s.chain === "ethereum").length;
  el("robinhood").textContent =
    signals.filter(s => s.chain === "robinhood").length;
  const filtered = signals.filter(s =>
    activeFilter === "all" || s.chain === activeFilter
  );
  el("cards").innerHTML = "";
  if (!filtered.length) {
    el("cards").innerHTML =
      '<div class="empty">No matching signals right now.<br>New qualifying tokens may appear on the next scan.</div>';
    return;
  }
  filtered.forEach(s => {
    const card = document.createElement("article");
    card.className = "card";
    const url = /^https:\/\/dexscreener\.com\//i.test(s.pairUrl || "")
      ? s.pairUrl
      : "";
    card.innerHTML = `
      <div class="top">
        <div class="token">${safeText(s.token || "Unknown")}</div>
        <span class="chain">${safeText(s.chain || "unknown")}</span>
      </div>
      <div class="change">+${Number(s.change || 0).toFixed(2)}%</div>
      <div class="metrics">
        <div class="metric"><span>Price</span><strong>${safeText(s.price || "—")}</strong></div>
        <div class="metric"><span>24h Volume</span><strong>${money(s.volume)}</strong></div>
        <div class="metric"><span>Liquidity</span><strong>${money(s.liquidity)}</strong></div>
        <div class="metric"><span>Market Cap / FDV</span><strong>${money(s.marketCap)}</strong></div>
      </div>
      <div class="address">Token: ${safeText(s.address || "Unavailable")}</div>
      ${url ? `<a class="link" href="${safeText(url)}" target="_blank" rel="noopener noreferrer">View on DexScreener ↗</a>` : ""}
    `;
    el("cards").appendChild(card);
  });
}
async function loadSignals() {
  try {
    const response = await fetch("./signals.json?t=" + Date.now(), {
      cache: "no-store"
    });
    if (!response.ok) throw new Error("HTTP " + response.status);
    const data = await response.json();
    signals = Array.isArray(data.signals) ? data.signals : [];
    el("status").textContent =
      "Last scanner update: " + (data.updated || "Not available");
    render();
  } catch (error) {
    el("status").textContent =
      "Could not load signals.json. Check that the scanner workflow has run successfully.";
  }
}
document.querySelectorAll("[data-filter]").forEach(button => {
  button.addEventListener("click", () => {
    activeFilter = button.dataset.filter;
    document.querySelectorAll("[data-filter]").forEach(b =>
      b.classList.toggle("active", b === button)
    );
    render();
  });
});
loadSignals();
setInterval(loadSignals, 300000);
</script>
</body>
</html>
