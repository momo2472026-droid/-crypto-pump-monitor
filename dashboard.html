<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crypto Pump Scanner</title>
<style>
body{background:#10131c;color:#f1f5f9;font-family:Arial,sans-serif;margin:0;padding:20px}
main{max-width:900px;margin:auto}
.panel{background:#1a2030;border:1px solid #30394d;border-radius:12px;padding:16px;margin:15px 0}
.muted{color:#9ca9bd}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #30394d}
button{background:#334155;color:white;border:0;padding:10px 14px;border-radius:8px}
</style>
</head>
<body>
<main>
<h1>🚀 Crypto Pump Scanner</h1>
<p class="muted">Updates every 5 minutes</p>
<section class="panel">
<p id="status">Loading signals…</p>
<p class="muted" id="updated"></p>
<button onclick="loadSignals()">Refresh now</button>
</section>
<section class="panel">
<div style="overflow-x:auto">
<table>
<thead><tr><th>Token</th><th>Price</th><th>Change</th><th>Volume</th><th>Liquidity</th></tr></thead>
<tbody id="signals"><tr><td colspan="5">Waiting for data…</td></tr></tbody>
</table>
</div>
</section>
</main>
<script>
async function loadSignals(){
 const status=document.getElementById('status');
 try{
  const response=await fetch('./signals.json?t='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw new Error('Could not load signals.json');
  const data=await response.json();
  const items=data.signals||[];
  document.getElementById('updated').textContent=
    data.updated?'Last scanner update: '+data.updated:'No update timestamp yet';
  document.getElementById('signals').innerHTML=items.length?
    items.map(s=>'<tr><td>'+safe(s.token||s.name||s.symbol||'—')+
    '</td><td>'+safe(s.price??'—')+'</td><td>'+safe(s.change??'—')+
    '</td><td>'+safe(s.volume??'—')+'</td><td>'+safe(s.liquidity??'—')+
    '</td></tr>').join(''):
    '<tr><td colspan="5">No signals published yet.</td></tr>';
  status.textContent='Dashboard connected to signals.json';
 }catch(e){status.textContent='Waiting for scanner data: '+e.message}
}
function safe(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
loadSignals();
setInterval(loadSignals,300000);
</script>
</body>
</html>
